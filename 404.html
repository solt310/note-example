<!doctype html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ページが見つかりません</title>
<meta name="robots" content="noindex">
<script>
(function(){var m={emdash:"media",astro:"corporate",html:"shop"};var p=location.pathname.match(/^\/note-example\/(emdash|astro|html)(\/.*)?$/);if(p){location.replace("/note-example/"+m[p[1]]+(p[2]||"/")+location.search+location.hash);}})();
</script>
<style>body{margin:0;font-family:system-ui,sans-serif;line-height:1.7;color:#222;background:#fafaf7}main{max-width:640px;margin:0 auto;padding:48px 16px}a{color:#0b5cad;font-weight:600}</style>
</head>
<body>
<main>
<h1>ページが見つかりません</h1>
<p>URL が変わったか、ページが削除された可能性があります。</p>
<p><a href="/note-example/">サンプルの一覧へ</a></p>
</main>
</body>
</html>
